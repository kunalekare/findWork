server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

spring:
  application:
    name: skillbridge-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/skillbridge_db}
    username: ${POSTGRES_USER:skillbridge_user}
    password: ${POSTGRES_PASSWORD:skillbridge_secure_password_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

security:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 Hours
    refresh-expiration-ms: 604800000 # 7 Days

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

app:
  is-production: ${APP_IS_PRODUCTION:false}

gst:
  invoice:
    gstin: ${GST_INVOICE_GSTIN:GSTIN-NOT-CONFIGURED-PILOT-ONLY}
    sac-code: ${GST_INVOICE_SAC_CODE:SAC-NOT-CONFIGURED}
  rate:
    percent: ${GST_RATE_PERCENT:18.0}

